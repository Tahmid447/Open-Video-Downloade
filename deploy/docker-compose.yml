name: open-video-downloader
services:
  downloader:
    image: ${OVD_IMAGE:-open-video-downloader:local}
    build:
      context: ..
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    stop_grace_period: 15s
    ports:
      - "127.0.0.1:${OVD_PORT:-8000}:8000"
    env_file: .env
    environment:
      DOWNLOAD_DIR: /data/downloads
      LIBRARY_DIR: /data/library
      STATE_DIR: /data/state
      CONFIG_DIR: /data/config
      LIBRARY_REQUIRE_MOUNT: '1'
      COOKIE_SECURE: '1'
      OVD_ALLOW_UNAUTHENTICATED_LOCAL: '0'
      OVD_LOCAL_SETUP: '0'
      OVD_REQUIRE_MFA: '1'
      OVD_REQUIRE_HTTPS: '1'
      OVD_ALLOWED_HOSTS: ${OVD_ALLOWED_HOSTS:-127.0.0.1,localhost}
      FORWARDED_ALLOW_IPS: '172.30.80.1'
    volumes:
      - media:/data/downloads
      - library:/data/library
      - state:/data/state
      - config:/data/config
    tmpfs:
      - /tmp:size=128m,mode=1777
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: ${OVD_MEMORY_LIMIT:-768m}
    cpus: ${OVD_CPUS:-1.5}
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    dns: [1.1.1.1, 9.9.9.9]
    networks: [private]
volumes:
  media:
  library:
  state:
  config:
networks:
  private:
    enable_ipv6: false
    driver_opts:
      com.docker.network.bridge.name: ovd0
    ipam:
      config:
        - subnet: 172.30.80.0/24
          gateway: 172.30.80.1
