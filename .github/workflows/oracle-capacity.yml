name: Oracle Always Free capacity
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: oracle-always-free-provisioning
  cancel-in-progress: false
jobs:
  capacity:
    if: github.repository == 'Tahmid447/Open-Video-Downloade' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: ovd-provisioning
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Oracle SDK
        run: python3 -m pip install --disable-pip-version-check -r deploy/oracle/requirements.txt pytest==9.1.1
      - name: Test safety guards
        run: python3 -m pytest tests/test_oracle_watch.py tests/test_deployment_storage.py -q
      - name: Check approved free capacity
        env:
          OCI_DOMAIN_URL: ${{ secrets.OCI_DOMAIN_URL }}
          OCI_CLIENT_ID: ${{ secrets.OCI_CLIENT_ID }}
          OCI_CLIENT_SECRET: ${{ secrets.OCI_CLIENT_SECRET }}
          OCI_WATCH_CONFIG: ${{ secrets.OCI_WATCH_CONFIG }}
        run: python3 deploy/oracle/watch.py
