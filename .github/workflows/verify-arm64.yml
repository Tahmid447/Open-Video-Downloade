name: Verify cloud ARM64 preparation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  arm64:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Confirm native architecture and shell syntax
        run: |
          test "$(uname -m)" = aarch64
          bash -n deploy/oracle/bootstrap.sh deploy/install-https-base.sh
      - name: Build existing ARM64 application
        run: docker build --tag ovd-arm64-verify .
      - name: Build isolated test layer
        run: |
          cat > /tmp/ovd-test.Dockerfile <<'EOF'
          FROM ovd-arm64-verify
          USER root
          COPY requirements-test.txt /tmp/requirements-test.txt
          COPY deploy/oracle/requirements.txt /tmp/oracle-requirements.txt
          RUN pip install --no-cache-dir -r /tmp/requirements-test.txt -r /tmp/oracle-requirements.txt
          COPY tests/ /app/tests/
          COPY deploy/ /app/deploy/
          USER 10001:10001
          EOF
          mkdir -p /tmp/ovd-test-context
          cp -R tests deploy requirements-test.txt /tmp/ovd-test-context/
          docker build -f /tmp/ovd-test.Dockerfile --tag ovd-arm64-tests /tmp/ovd-test-context
      - name: Run native tests without network or host data
        run: |
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,exec,nosuid,nodev,size=2g --entrypoint python ovd-arm64-tests \
            -m pytest -p no:cacheprovider /app/tests -q
  trust-rejection:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: ovd-provisioning
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 -m pip install --disable-pip-version-check -r deploy/oracle/requirements.txt
      - name: Oracle must reject a different workflow
        env:
          OCI_DOMAIN_URL: ${{ secrets.OCI_DOMAIN_URL }}
          OCI_CLIENT_ID: ${{ secrets.OCI_CLIENT_ID }}
          OCI_CLIENT_SECRET: ${{ secrets.OCI_CLIENT_SECRET }}
        run: |
          python3 - <<'PYCODE'
          import sys
          sys.path.insert(0,'deploy/oracle')
          from watch import authenticate,GuardStop
          try:
              authenticate()
          except GuardStop as error:
              assert str(error)=='OCI_TOKEN_EXCHANGE_HTTP_401_UNAUTHORIZED_CLIENT'
              print('Oracle rejected the non-authorized workflow identity.')
          else:
              raise SystemExit('Unexpected access: disable the watch and inspect trust constraints.')
          PYCODE
